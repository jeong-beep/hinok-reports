<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일일매출현황 · 희녹</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  /* ── 토큰 : monthly/mileage.html과 동일 체계 ─────────────── */
  :root {
    color-scheme: light;
    --plane:        #ffffff;
    --surface:      #ffffff;
    --surface-2:    #f2f5f7;
    --ink:          #15191d;
    --ink-2:        #4c545c;
    --ink-muted:    #8b939c;
    --hairline:     #e6e9eb;
    --border:       rgba(15,23,32,0.10);
    --accent:       #1d6fa5;
    --accent-soft:  #e8f1fa;
    --good:         #0ca30c;
    --serious:      #c1543a;
    --up:           #c1543a;   /* 국내 관행 : 상승 적색 */
    --down:         #1d6fa5;   /*            하락 청색 */
    --neg:          #c1543a;   /* 마이너스 금액 */
    --memo:         #e07a1f;   /* 메모 표시 주황 */
    --noteflo-bg:   #fdeeea;   /* 한 줄 코멘트 : 연한 붉은 배경 */
    --noteflo-bd:   #f3c6ba;
    --noteflo-ink:  #c0561a;   /* 진한 주황 */
    --today-hl:     #f2f542;   /* TODAY 형광 노랑 */
    --today-bd:     #e8690b;   /* 당일 행 테두리 : 메모 주황보다 한 톤 진하게 */
    /* 열별 색 스케일의 가장 진한 단계. 농도는 알파로만 조절해
       글자가 흰색으로 바뀔 만큼 어두워지지 않습니다. */
    --scale-rgb:    122, 179, 230;
    /* 판매처 색 — CH_ORDER 위치와 1:1 고정.
       자사몰·네이버·카카오·29cm는 지정 브랜드 색이고, 인접 구간이
       색각 이상에서 구분되도록 명도 계단으로 배치했습니다. */
    --c1:#1B6B3A;   /* 자사몰       진한 초록 */
    --c2:#4E9A1F;   /* 네이버       연두 */
    --c3:#F7C500;   /* 카카오       노랑 */
    --c4:#B5457B;   /* 캐리마켓(온) */
    --c5:#1A1A1A;   /* 29cm        검정 */
    --c6:#9A5F2B;   /* 제네시스 */
    --c7:#2A78D6;   /* 현대M몰 */
    --c8:#C0392B;   /* 롯데백화점(온) */
    --c9:#5C5FBF;   /* 신세계면세점 */
    --c10:#DE5F2A;  /* 롯데면세점 */
    --c11:#008B7A;  /* 신라면세점 */
    --c12:#7B3FA0;  /* 플래그쉽 */
    --c13:#0288A7;  /* HOS청담 */
    --c14:#6D7C1F;  /* 어메니티 */
    --c15:#D14A8F;  /* 페이히어 */
    --c-other:#8b939c;
    --shadow: 0 1px 2px rgba(15,23,32,.05), 0 8px 24px -12px rgba(15,23,32,.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --plane:#14171a; --surface:#1c2024; --surface-2:#23282d;
      --ink:#f2f4f6; --ink-2:#c1c8ce; --ink-muted:#8b939c;
      --hairline:#2c3237; --border:rgba(255,255,255,0.10);
      --accent:#3e8cc4; --accent-soft:#1c2a3d;
      --good:#0ca30c; --serious:#c96a50;
      --up:#c96a50; --down:#3e8cc4; --neg:#e8877a; --memo:#f0a04b;
      --noteflo-bg:#3b211b; --noteflo-bd:#5d3529; --noteflo-ink:#f0a86b;
      --today-hl:#d8dc22; --scale-rgb:122, 179, 230; --today-bd:#ff9d4d;
      /* 29cm 검정은 어두운 배경에서 묻히므로 흰색으로 반전됩니다 */
      --c1:#0C7B46;  --c2:#5CA51E;  --c3:#E8B900;  --c4:#D46A9C;  --c5:#D8D8D8;
      --c6:#B7823F;  --c7:#3987E5;  --c8:#E06A5A;  --c9:#8286E0;  --c10:#D66E45;
      --c11:#26A69A; --c12:#8B5BB5; --c13:#3AA8C4; --c14:#8A9930; --c15:#DA649F;
      --c-other:#8b939c;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane:#14171a; --surface:#1c2024; --surface-2:#23282d;
    --ink:#f2f4f6; --ink-2:#c1c8ce; --ink-muted:#8b939c;
    --hairline:#2c3237; --border:rgba(255,255,255,0.10);
    --accent:#3e8cc4; --accent-soft:#1c2a3d;
    --good:#0ca30c; --serious:#c96a50;
    --up:#c96a50; --down:#3e8cc4; --neg:#e8877a; --memo:#f0a04b;
    --noteflo-bg:#3b211b; --noteflo-bd:#5d3529; --noteflo-ink:#f0a86b;
    --today-hl:#d8dc22; --scale-rgb:122, 179, 230; --today-bd:#ff9d4d;
    --c1:#0C7B46;  --c2:#5CA51E;  --c3:#E8B900;  --c4:#D46A9C;  --c5:#D8D8D8;
    --c6:#B7823F;  --c7:#3987E5;  --c8:#E06A5A;  --c9:#8286E0;  --c10:#D66E45;
    --c11:#26A69A; --c12:#8B5BB5; --c13:#3AA8C4; --c14:#8A9930; --c15:#DA649F;
    --c-other:#8b939c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--plane); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
                 "맑은 고딕", "Apple SD Gothic Neo", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .num { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
         font-variant-numeric: tabular-nums; }
  .neg { color: var(--neg); }

  /* ── 로그인 게이트 ──────────────────────────────────────── */
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .gate-card { width: min(420px, 100%); background: var(--surface);
               border: 1px solid var(--hairline); border-radius: 14px;
               padding: 32px 28px; box-shadow: var(--shadow); text-align: center; }
  .gate-card .mark { width: 3px; height: 34px; background: var(--accent);
                     border-radius: 2px; margin: 0 auto 16px; }
  .gate-card h1 { margin: 0 0 6px; font-size: 18px; font-weight: 650; }
  .gate-card p { margin: 0 0 22px; color: var(--ink-muted); font-size: 13px; }
  #gsiButton { display: flex; justify-content: center; min-height: 44px; }
  .gate-msg { margin-top: 16px; font-size: 12.5px; color: var(--serious); min-height: 18px; }
  .gate-foot { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--hairline);
               font-size: 11.5px; color: var(--ink-muted); line-height: 1.6; }

  .app { display: none; }
  html.auth-ok .gate { display: none; }
  html.auth-ok .app  { display: block; }

  .wrap { max-width: 1560px; margin: 0 auto; padding: 24px 20px 72px; }

  /* ── 헤더 ───────────────────────────────────────────────── */
  header.top { display: flex; flex-wrap: wrap; align-items: flex-end;
               justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .mark { width: 3px; height: 40px; background: var(--accent); border-radius: 2px; }
  h1.title { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
  .crumb { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-muted); }
  .crumb a { color: var(--accent); text-decoration: none; }
  .crumb a:hover { text-decoration: underline; }
  .who { text-align: right; font-size: 11.5px; color: var(--ink-muted); }
  .who strong { display: block; font-size: 13px; color: var(--ink-2); font-weight: 600; }
  /* 관리자 화면 ↔ 일반 화면 전환. 관리자에게만 보입니다. */
  #viewToggle { display: none; font: inherit; font-size: 11px; cursor: pointer;
                margin-top: 4px; padding: 2px 9px; border-radius: 999px;
                border: 1px solid var(--hairline); background: var(--surface-2);
                color: var(--ink-muted); }
  #viewToggle:hover { border-color: var(--accent); color: var(--accent); }
  html.can-admin #viewToggle { display: inline-block; }
  /* 일반 화면을 미리 보는 중 — 지금 내 화면이 아니라는 걸 또렷이 표시합니다 */
  html.can-admin:not(.is-admin) #viewToggle {
    color: var(--memo); font-weight: 700;
    background: color-mix(in srgb, var(--memo) 14%, transparent);
    border-color: color-mix(in srgb, var(--memo) 40%, transparent); }
  html.can-admin:not(.is-admin) #viewToggle:hover { color: var(--memo); }

  /* ── 컨트롤 : 스크롤해도 상단에 붙어 있습니다 ─────────────── */
  .controls-dock { position: sticky; top: 0; z-index: 60;
                   background: var(--plane); padding: 10px 0 6px; margin-bottom: 10px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end;
              background: var(--surface); border: 1px solid var(--hairline);
              border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span { font-size: 10.5px; letter-spacing: .09em; color: var(--ink-muted); }
  select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2);
           border: 1px solid var(--hairline); border-radius: 8px; padding: 6px 9px; min-height: 32px; }
  select:focus-visible, button:focus-visible, a:focus-visible, td:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--hairline);
         border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button { font: inherit; font-size: 12.5px; border: 0; background: transparent;
                color: var(--ink-2); padding: 5px 12px; border-radius: 6px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
  .seg .short { display: none; }
  .ghost { font: inherit; font-size: 12.5px; background: var(--surface-2); color: var(--ink-2);
           border: 1px solid var(--hairline); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .spacer { flex: 1 1 auto; }
  /* 다시 불러오기는 원본을 올리는 담당자에게만 보이면 됩니다.
     다른 분들은 새로고침(F5)으로 같은 결과를 얻습니다. */
  #reload { display: none; }
  html.is-admin #reload { display: inline-flex; align-items: center; }
  #reload .icon { display: none; }
  .who #whoFetched { display: block; }

  /* ── 한 줄 코멘트 : 첫 카드 위에 떠 있습니다 ────────────── */
  .noteflo { position: sticky; top: 74px; z-index: 40; margin-bottom: 14px;
             background: var(--noteflo-bg); border: 1px solid var(--noteflo-bd);
             border-radius: 12px; padding: 11px 16px; text-align: center;
             color: var(--noteflo-ink); font-weight: 700; font-size: 13.5px;
             line-height: 1.5; box-shadow: var(--shadow); white-space: pre-wrap; }
  .noteflo[hidden] { display: none; }

  /* ── KPI ────────────────────────────────────────────────── */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(206px, 1fr));
          gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px;
         padding: 14px 16px; box-shadow: var(--shadow); text-align: center; }
  .kpi .k { font-size: 10.5px; letter-spacing: .09em; color: var(--ink-muted); }
  .kpi .v { font-size: 24px; font-weight: 620; margin-top: 4px; letter-spacing: -.02em; }
  .kpi .v.long { font-size: 20px; }
  .kpi .v small { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
  .kpi .d { font-size: 12px; margin-top: 5px; color: var(--ink-muted); }
  .chip { display: inline-flex; align-items: center; gap: 3px; font-weight: 620;
          font-size: 12px; padding: 1px 6px; border-radius: 6px; }
  .chip.up   { color: var(--up);   background: color-mix(in srgb, var(--up) 12%, transparent); }
  .chip.down { color: var(--down); background: color-mix(in srgb, var(--down) 12%, transparent); }
  .chip.flat { color: var(--ink-muted); background: var(--surface-2); }

  /* 누적 실적 — promotion 을 골랐을 때만 */
  .promosum { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr));
              gap: 8px; margin-bottom: 14px; }
  .promosum[hidden] { display: none; }
  .promosum .s { background: var(--surface); border: 1px solid var(--hairline);
                 border-radius: 10px; padding: 9px 11px; text-align: center;
                 box-shadow: var(--shadow); }
  .promosum .s .k { font-size: 9.5px; letter-spacing: .05em; color: var(--ink-muted); }
  .promosum .s .v { font-size: 16px; font-weight: 650; margin-top: 2px; }
  .promosum .s .v small { font-size: 11px; font-weight: 500; color: var(--ink-2); }

  /* ── 탭 : 판매 현황 / 프로모션 리뷰 ─────────────────────── */
  .tabs { display: flex; align-items: center; gap: 2px; margin-bottom: 14px;
          border-bottom: 1px solid var(--hairline); }
  .tabs button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-muted);
                 background: transparent; border: 0; border-bottom: 2px solid transparent;
                 margin-bottom: -1px; padding: 9px 14px; border-radius: 7px 7px 0 0; cursor: pointer; }
  .tabs button:hover:not([disabled]) { color: var(--ink-2); background: var(--surface-2); }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs[hidden] { display: none; }

  /* ── 프로모션 리뷰 ──────────────────────────────────────── */
  /* 개요 : 한 줄에 한 항목. 이름은 오른쪽에 붙이고 값이 그 옆에 섭니다. */
  .facts > div { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px;
                 align-items: baseline; padding: 8px 0;
                 border-bottom: 1px solid var(--hairline); }
  .facts > div:last-child { border-bottom: 0; }
  .facts .k { font-size: 11.5px; color: var(--ink-muted); text-align: right; }
  .facts .v { font-size: 13px; font-weight: 550; color: var(--ink); overflow-wrap: anywhere; }
  .facts .v.none { color: var(--ink-muted); font-weight: 400; }
  .facts > div.title .v { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }

  /* 리뷰 표 : 항목 이름은 우측, 값은 좌측 — 기존 시트 리뷰와 같은 배치 */
  table.rv { width: 100%; min-width: 0; }
  table.rv thead th { font-size: 10.5px; }
  table.rv th.k, table.rv td.k { text-align: right; color: var(--ink-2); white-space: nowrap; }
  table.rv td.k { width: 210px; }
  table.rv tr.sub td.k { color: var(--ink-muted); font-size: 12px; }
  table.rv tr.head td { background: var(--surface-2); font-weight: 700; }
  table.rv td.v { text-align: left; font-weight: 620; }
  table.rv td.d { text-align: center; width: 132px; font-size: 12px; }
  .na { color: var(--ink-muted); font-weight: 400; }

  /* 발신 성과 : 지표가 행, 발신이 열 */
  #rvSend td.k { width: 150px; }
  #rvSend td.s { text-align: center; }
  #rvSend tr.chline td { background: var(--surface-2); font-weight: 620; }

  .rv-note { font-size: 11.5px; color: var(--ink-muted); line-height: 1.7;
             padding: 11px 16px 14px; border-top: 1px solid var(--hairline); }
  /* 어느 시트로 계산했는지 — 리뷰 맨 위에 항상 띄웁니다 */
  .rv-src { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 12px;
            background: var(--surface); border: 1px solid var(--hairline);
            border-radius: 12px; padding: 10px 14px; margin-bottom: 14px;
            font-size: 12px; color: var(--ink-muted); box-shadow: var(--shadow); }
  .pill { display: inline-block; font-size: 11px; font-weight: 700;
          padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.final { color: var(--good); background: color-mix(in srgb, var(--good) 13%, transparent); }
  .pill.prov  { color: var(--memo); background: color-mix(in srgb, var(--memo) 15%, transparent); }
  .rv-src .sp { flex: 1 1 auto; }

  /* 리뷰 맨 위 줄 — 건수와 CSV 버튼 */
  .rv-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
            font-size: 12.5px; color: var(--ink-muted); }
  .rv-top .sp { flex: 1 1 auto; }

  /* 프로모션마다 상세가 이어집니다 */
  .rv-sec { margin-top: 30px; scroll-margin-top: 96px; }
  .rv-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px;
          margin: 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--accent);
          font-size: 15px; font-weight: 660; letter-spacing: -.01em; }
  .rv-h .when { font-size: 12px; font-weight: 500; color: var(--ink-muted); }
  .rv-h .sp { flex: 1 1 auto; }
  .rv-more { margin-top: 26px; text-align: center; font-size: 12.5px; color: var(--ink-muted); }

  /* 프로모션 비교 — 지표가 행, 프로모션이 열. 이 프로모션 칸(.g)을 옅게 깔아 둡니다 */
  #rvVs td.g, #rvVs th.g { background: var(--surface-2); font-weight: 620; }
  #rvVs td.k { width: 190px; }
  #rvVs td.c, #rvVs td.num { min-width: 150px; }
  #rvVs .src { display: inline-block; margin-left: 5px; font-size: 10px; font-weight: 600;
               color: var(--ink-muted); border: 1px solid var(--hairline);
               border-radius: 999px; padding: 0 5px; vertical-align: middle; }
  .rv-warn { background: color-mix(in srgb, var(--serious) 8%, transparent);
             border: 1px solid color-mix(in srgb, var(--serious) 30%, transparent);
             color: var(--serious); border-radius: 10px; padding: 10px 14px;
             font-size: 12.5px; line-height: 1.65; margin-bottom: 14px; }
  .rv-empty { background: var(--surface); border: 1px dashed var(--hairline);
              border-radius: 12px; padding: 26px 20px; text-align: center;
              color: var(--ink-muted); font-size: 13px; line-height: 1.7; }
  .rv-empty b { display: block; color: var(--ink-2); font-size: 14px; margin-bottom: 6px; }

  /* 판매처 × 상품 × 날짜 : 좌측 4열 고정 */
  #x .x1, #x .x2, #x .x3, #x .x4 { position: sticky; z-index: 2; background: var(--surface); }
  #x thead .x1, #x thead .x2, #x thead .x3, #x thead .x4 { z-index: 7; background: var(--surface-2); }
  #x .x1 { left: 0;    min-width: 76px; max-width: 76px; }
  #x .x2 { left: 76px; }                    /* 상품명은 잘리지 않게 내용만큼 */
  #x .x3 { min-width: 96px; }
  #x .x4 { min-width: 90px; border-right: 1px solid var(--hairline); }
  #x tr.chrow td { background: var(--surface-2); font-weight: 700;
                   border-top: 1px solid var(--border); }
  #x tr.chrow .x1, #x tr.chrow .x2, #x tr.chrow .x3, #x tr.chrow .x4 { background: var(--surface-2); }
  #x .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  #x .pcode { font-size: 9.5px; color: var(--ink-muted); margin-left: 4px; }
  #x tr.total td { background: var(--surface-2); font-weight: 700;
                   border-top: 1px solid var(--border); }

  /* ── 카드 ───────────────────────────────────────────────── */
  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px;
          box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; }
  .card > .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px;
                  padding: 13px 16px; border-bottom: 1px solid var(--hairline); }
  .card > .head h2 { margin: 0; font-size: 14px; font-weight: 640; }
  .card > .head .note { font-size: 11.5px; color: var(--ink-muted); }
  .card > .head .headavg { font-size: 12px; font-weight: 620; color: var(--ink-2);
                           text-align: right; margin-left: auto; }
  .card > .body { padding: 14px 16px; }
  .card > .body.flush { padding: 0; }

  /* ── 차트 ───────────────────────────────────────────────── */
  .chartbox { position: relative; }
  svg.chart { display: block; width: 100%; height: auto; }
  svg.chart .gridline { stroke: var(--hairline); stroke-width: 1; }
  svg.chart .axis { stroke: var(--border); stroke-width: 1; }
  svg.chart text { fill: var(--ink-muted); font-size: 10.5px;
                   font-family: ui-monospace, Consolas, monospace; }
  svg.chart text.lbl { font-family: inherit; }
  .tip { position: absolute; pointer-events: none; z-index: 5; opacity: 0;
         transform: translate(-50%, -100%); transition: opacity .1s;
         background: var(--ink); color: var(--plane); padding: 7px 10px;
         border-radius: 8px; font-size: 12px; white-space: nowrap; box-shadow: var(--shadow); }
  .tip .t-d { font-size: 10.5px; opacity: .72; }
  .tip .t-m { font-size: 11px; margin-top: 3px; max-width: 300px; white-space: normal;
              border-top: 1px solid rgba(255,255,255,.2); padding-top: 3px; }
  .tip .t-rows { margin-top: 5px; padding-top: 4px; font-size: 11px;
                 border-top: 1px solid rgba(255,255,255,.2); }
  .tip .t-rows div { display: grid; grid-template-columns: 9px 1fr auto 44px;
                     align-items: center; gap: 6px; line-height: 1.65; }
  .tip .t-rows i { width: 7px; height: 7px; border-radius: 2px; }
  .tip .t-rows b { font-weight: 600; }
  .tip .t-rows em { font-style: normal; opacity: .66; text-align: right; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 10px 16px 0; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .legend i.dash { height: 0; width: 14px; border-radius: 0;
                   border-top: 2px dashed var(--ink); opacity: .5; }

  /* ── 표 ─────────────────────────────────────────────────── */
  /* 세로는 내용만큼 늘어납니다. 가로만 필요할 때 스크롤됩니다. */
  .tablewrap { overflow-x: auto; overflow-y: visible; max-width: 100%;
               -webkit-overflow-scrolling: touch; }
  table { border-collapse: separate; border-spacing: 0; font-size: 12.5px;
          width: max-content; min-width: 100%; }
  th, td { padding: 6px 10px; white-space: nowrap; border-bottom: 1px solid var(--hairline); }
  /* 제목 열과 날짜 행은 가운데 정렬 */
  /* 층 순서 : 제목행(6·7) > 통계행(4·5) > 본문 고정열(2) */
  thead th { position: sticky; top: 0; z-index: 6; background: var(--surface-2);
             font-weight: 600; font-size: 11px; color: var(--ink-2); text-align: center;
             border-bottom: 1px solid var(--border); }
  tbody td { text-align: right; }
  td.l, th.l { text-align: left; }
  td.c, th.c { text-align: center; }
  th.chlink { cursor: pointer; }
  th.chlink span { color: var(--accent); text-decoration: underline;
                   text-underline-offset: 2px; text-decoration-thickness: 1px; }
  th.chlink:hover span { text-decoration-thickness: 2px; }

  /* 판매처 표는 PC에서 가로 스크롤 없이 화면 폭에 들어가야 합니다.
     열이 17개까지 늘어나므로 글자와 여백을 조여 폭을 맞춥니다. */
  /* PC에서 판매처 표는 폭이 맞으므로 스크롤 상자로 두지 않습니다.
     카드의 overflow:hidden 까지 풀어야 제목행·통계행이 화면 기준으로 고정됩니다.
     대신 맨 아랫줄 모서리를 직접 둥글게 해 카드 모양을 지킵니다. */
  #m1Card, #m1Card .tablewrap { overflow: visible; }
  #m1 tbody tr:last-child td { border-bottom: 0; }
  #m1 tbody tr:last-child td:first-child { border-bottom-left-radius: 11px; }
  #m1 tbody tr:last-child td:last-child { border-bottom-right-radius: 11px; }
  #m1 { width: 100%; min-width: 0; font-size: 11px; }
  #m1 th, #m1 td { padding: 4px 3px; }
  #m1 thead th { font-size: 10px; padding: 4px 2px; letter-spacing: -.01em; }
  #m1 .chip { font-size: 10.5px; padding: 0 4px; }
  #m1 .stick { position: sticky; left: 0; z-index: 2; background: var(--surface);
               border-right: 1px solid var(--hairline); min-width: 74px; }
  #m1 thead .stick { z-index: 7; background: var(--surface-2); }
  #m1 .totcol { font-weight: 620; background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
  #m1 thead .totcol { background: color-mix(in srgb, var(--accent) 10%, var(--surface-2)); }

  /* 상품 매트릭스 : 좌측 6열 고정 (제품라인·상품코드·상품명·정상가·일평균·합계) */
  #m2 .p1, #m2 .p2, #m2 .p3, #m2 .p4, #m2 .p5, #m2 .p6 {
    position: sticky; z-index: 2; background: var(--surface); }
  #m2 thead .p1, #m2 thead .p2, #m2 thead .p3,
  #m2 thead .p4, #m2 thead .p5, #m2 thead .p6 {
    z-index: 7; background: var(--surface-2); }
  #m2 .p1 { left: 0;     min-width:  78px; max-width:  78px; }
  #m2 .p2 { left: 78px;  min-width: 116px; max-width: 116px; }
  #m2 .p3 { left: 194px; min-width: 240px; max-width: 240px;
            overflow: hidden; text-overflow: ellipsis; }
  #m2 .p4 { left: 434px; min-width:  92px; max-width:  92px; }
  #m2 .p5 { left: 526px; min-width: 104px; max-width: 104px; }
  #m2 .p6 { left: 630px; min-width: 110px; max-width: 110px;
            border-right: 1px solid var(--hairline); }

  /* 호버 : 반투명 덮개. 인라인 배경(색 스케일) 위에 얹혀 색이 비쳐 보입니다. */
  tbody tr:hover td { box-shadow: inset 0 0 0 9999px color-mix(in srgb, var(--accent) 10%, transparent); }
  td.zero { color: var(--ink-muted); opacity: .35; }
  tr.stat td { background: var(--surface-2); font-weight: 620; }
  tr.stat.top td { border-bottom: 1px solid var(--border); }
  tr.stat.bottom td { border-top: 1px solid var(--border); }
  /* 당일 강조는 배경을 덮지 않고 행 전체를 감싸는 테두리로 표시합니다.
     셀마다 위·아래를, 양 끝 셀에만 좌·우를 그려 한 줄을 두르는 사각형이 됩니다. */
  #m1 tbody tr.today td {
    border-top: 2px solid var(--today-bd);
    border-bottom: 2px solid var(--today-bd);
  }
  #m1 tbody tr.today td:first-child { border-left: 2px solid var(--today-bd); }
  #m1 tbody tr.today td:last-child  { border-right: 2px solid var(--today-bd); }
  .code { font-size: 11px; color: var(--ink-muted); }
  .line-tag { display: inline-block; font-size: 10px; letter-spacing: .04em; color: var(--ink-2);
              background: var(--surface-2); border: 1px solid var(--hairline);
              border-radius: 5px; padding: 0 5px; }

  /* 메모가 달린 값 — 주황 굵은 테두리, 누르면 내용이 열립니다 */
  /* 메모 링은 outline 으로 그립니다 — box-shadow 는 호버 덮개가 쓰고 있어서요 */
  td.hasmemo, th.hasmemo { position: relative; cursor: pointer; border-radius: 3px;
                           outline: 2px solid var(--memo); outline-offset: -2px; }
  td.hasmemo::after, th.hasmemo::after {
    content: ''; position: absolute; top: 2px; right: 2px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--memo); }
  td.hasmemo.open, th.hasmemo.open { outline-width: 3px; }

  .memopop { position: fixed; z-index: 200; max-width: min(340px, 88vw);
             background: var(--surface); color: var(--ink);
             border: 1px solid var(--memo); border-left-width: 4px; border-radius: 10px;
             padding: 11px 13px; box-shadow: 0 8px 28px -8px rgba(0,0,0,.35);
             font-size: 12.5px; line-height: 1.55; }
  .memopop .mp-h { font-size: 10.5px; letter-spacing: .05em; color: var(--memo);
                   font-weight: 700; margin-bottom: 5px; }
  .memopop .mp-t { white-space: pre-wrap; color: var(--ink-2); }
  .memopop .mp-t + .mp-t { margin-top: 7px; padding-top: 7px;
                           border-top: 1px solid var(--hairline); }

  .status { display: flex; align-items: center; gap: 10px; padding: 40px 16px;
            justify-content: center; color: var(--ink-muted); font-size: 13px; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--hairline);
             border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .errbox { background: color-mix(in srgb, var(--serious) 8%, transparent);
            border: 1px solid color-mix(in srgb, var(--serious) 32%, transparent);
            color: var(--serious); border-radius: 10px; padding: 14px 16px;
            font-size: 13px; margin-bottom: 16px; }
  .errbox b { display: block; margin-bottom: 4px; }
  .errbox details { margin-top: 8px; }
  .errbox summary { cursor: pointer; font-size: 12px; opacity: .8; }
  .errbox code { display: block; margin-top: 6px; padding: 8px 10px; border-radius: 6px;
                 background: var(--surface-2); color: var(--ink-2); font-size: 11.5px;
                 line-height: 1.5; white-space: pre-wrap; word-break: break-word;
                 font-family: ui-monospace, Consolas, monospace; }
  .errbox #retry { margin-top: 10px; }

  footer { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--hairline);
           color: var(--ink-muted); font-size: 11.5px; display: grid; gap: 4px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @media print { .controls-dock, .ghost, .who { display: none; }
                 .tablewrap { max-height: none; overflow: visible; }
                 .card { break-inside: avoid; box-shadow: none; } }

  @media (max-width: 640px) {
    .wrap { padding: 16px 12px 56px; }
    /* KPI는 두 개씩 */
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .kpi { padding: 12px 13px; }
    .kpi .v { font-size: 18px; }
    .kpi .v.long { font-size: 15px; }
    .kpi .v small { font-size: 12px; }
    .kpi .k { font-size: 10px; letter-spacing: .04em; }
    .kpi .d, .chip { font-size: 11px; }

    /* 고정바를 한 줄에 담습니다 : 라벨 숨김, 지표는 짧은 문구, 새로고침은 아이콘 */
    .controls-dock { padding: 6px 0 4px; margin-bottom: 8px; }
    .controls { flex-wrap: nowrap; gap: 6px; padding: 7px 8px; align-items: center; }
    .field { flex: 1 1 auto; min-width: 0; }
    .field > span { display: none; }
    select { font-size: 12px; padding: 3px 4px; min-height: 30px; width: 100%; }
    .seg { flex: 0 0 auto; padding: 2px; }
    .seg button { font-size: 11.5px; padding: 4px 7px; }
    .seg .long { display: none; }
    .seg .short { display: inline; }
    .spacer { display: none; }
    /* 좁은 화면에서는 담당자에게도 숨깁니다 — 새로고침(F5)으로 대체되고,
       그 자리에 promotion 드롭다운이 들어가야 한 줄이 유지됩니다. */
    html.is-admin #reload { display: none; }
    .controls .field { flex: 1 1 0; min-width: 0; }
    select { text-overflow: ellipsis; }

    /* 범례와 CSV 버튼은 좁은 화면에서 자리만 차지합니다.
       다만 원본을 다루는 담당자는 휴대폰에서도 받아야 할 때가 있어 관리자에게만 남깁니다.
       is-admin 으로 걸었으므로 일반 화면 미리보기 중에는 함께 사라집니다. */
    .legend { display: none; }
    [data-csv] { display: none; }
    html.is-admin [data-csv] { display: inline-block; }

    /* 프로모션 비교는 좁은 화면에서도 봅니다 — 열 폭을 줄이고 가로로 흘리되,
       항목 이름 칸은 왼쪽에 붙여 두어야 옆으로 밀어도 무슨 줄인지 보입니다. */
    #rvVs td.c, #rvVs td.num { min-width: 118px; }
    #rvVs td.k { position: sticky; left: 0; z-index: 2; background: var(--surface);
                 max-width: 96px; white-space: normal; word-break: keep-all; }
    #rvVs th.k { position: sticky; left: 0; z-index: 3; background: var(--surface-2); }
    #rvVs .src { margin-left: 0; margin-top: 2px; }
    .noteflo { font-size: 12.5px; padding: 9px 12px; margin-bottom: 10px; }
    .card > .head .headavg { font-size: 11px; }
    /* 좁은 화면에서는 판매처 표도 가로로 스크롤합니다 (행 고정은 이때 동작하지 않습니다) */
    #m1Card .tablewrap { overflow-x: auto; }
    #m1 { width: max-content; font-size: 11px; }
    #m1 th, #m1 td { padding: 5px 6px; }

    /* 상품 매트릭스는 고정열을 풀어야 좌우로 스크롤됩니다 */
    #m2 .p1, #m2 .p2, #m2 .p3, #m2 .p4, #m2 .p5, #m2 .p6 { position: static; }
    #x .x1, #x .x2, #x .x3, #x .x4 { position: static; }
    #x .x4 { border-right: 0; }
    .promosum { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
    .promosum .s { padding: 7px 8px; }
    .promosum .s .v { font-size: 14px; }
    #m2 .p3 { min-width: 180px; max-width: 180px; }
    #m2 .p6 { border-right: 0; }
    .tablewrap { overscroll-behavior-x: contain; }
    th, td { padding: 5px 8px; }

    /* 탭과 리뷰 : 좁은 화면에서는 항목 이름 칸을 줄이고 표는 가로로 흘립니다 */
    .tabs button { font-size: 12.5px; padding: 8px 10px; }
    .facts > div { grid-template-columns: 104px minmax(0, 1fr); gap: 10px; }
    .facts .k { font-size: 11px; }
    .facts > div.title .v { font-size: 15px; }
    table.rv { width: max-content; }
    table.rv td.k, table.rv th.k { width: auto; }
    table.rv td.d { width: auto; }
  }
</style>
</head>
<body>

<!-- ── 로그인 ─────────────────────────────────────────────── -->
<div class="gate">
  <div class="gate-card">
    <div class="mark"></div>
    <h1>일일매출현황</h1>
    <p>hinok.life 계정으로 로그인해 주세요.</p>
    <div id="gsiButton"></div>
    <div class="gate-msg" id="gateMsg"></div>
    <div class="gate-foot">
      이 페이지에는 매출 데이터가 담겨 있지 않습니다.<br>
      로그인 후 구글이 권한을 확인한 뒤에만 시트에서 불러옵니다.
    </div>
  </div>
</div>

<!-- ── 대시보드 ───────────────────────────────────────────── -->
<div class="app">
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="mark"></div>
        <div>
          <h1 class="title" id="pageTitle">일일매출현황</h1>
          <p class="crumb" id="crumb">주문일 기준 · 배송비 미포함 · 취소/교환/반품/환불 미반영</p>
        </div>
      </div>
      <div class="who">
        <strong id="whoEmail">—</strong>
        <span id="whoAsOf">—</span>
        <span id="whoFetched"></span>
        <button type="button" id="viewToggle"></button>
      </div>
    </header>

    <div id="errSlot"></div>

    <div class="controls-dock">
      <div class="controls">
        <label class="field"><span>기간</span>
          <select id="period"></select>
        </label>
        <div class="seg" id="metric" role="group" aria-label="지표 선택">
          <button type="button" data-v="amt" aria-pressed="true">
            <span class="long">주문금액</span><span class="short">금액</span></button>
          <button type="button" data-v="qty" aria-pressed="false">
            <span class="long">주문수량</span><span class="short">수량</span></button>
        </div>
        <label class="field"><span>판매처</span>
          <select id="channel"><option value="">전체 판매처</option></select>
        </label>
        <label class="field"><span>promotion</span>
          <select id="promo"><option value="">전체</option></select>
        </label>
        <div class="spacer"></div>
        <button class="ghost" type="button" id="reload"
                title="시트에서 다시 불러옵니다" aria-label="다시 불러오기">
          <span class="icon">🔄</span><span class="text">다시 불러오기</span>
        </button>
      </div>
    </div>

    <div id="loading" class="status"><div class="spinner"></div><span>시트에서 불러오는 중…</span></div>

    <div class="tabs" id="tabs" role="tablist" hidden>
      <button type="button" role="tab" data-tab="sales" aria-selected="true">판매 현황</button>
      <button type="button" role="tab" data-tab="review" aria-selected="false">프로모션 리뷰</button>
    </div>

    <div id="dash" hidden>
      <div class="promosum" id="promoSum" hidden></div>
      <div class="kpis" id="kpis"></div>

      <div class="noteflo" id="noteFlo" hidden></div>

      <section class="card">
        <div class="head">
          <h2 id="trendTitle">일일 총 주문금액 추이</h2>
          <span class="note">막대 한 칸이 판매처 하나입니다 — 올리면 판매처·금액·비중이 나옵니다.</span>
          <span class="spacer"></span>
          <span class="headavg num" id="trendAvg"></span>
        </div>
        <div class="legend" id="trendLegend"></div>
        <div class="body">
          <div class="chartbox" id="trendBox">
            <svg class="chart" id="trend" viewBox="0 0 1000 300"
                 role="img" aria-label="판매처별 일일 주문금액 누적막대와 총액 추이선"></svg>
            <div class="tip" id="trendTip"></div>
          </div>
        </div>
      </section>

      <section class="card" id="xCard" hidden>
        <div class="head">
          <h2 id="xTitle">판매처 × 상품</h2>
          <span class="note" id="xNote"></span>
          <span class="spacer"></span>
          <button class="ghost" type="button" data-csv="x">CSV 다운로드</button>
        </div>
        <div class="body flush"><div class="tablewrap"><table id="x"></table></div></div>
      </section>

      <section class="card" id="m1Card">
        <div class="head">
          <h2>판매처별 일일 총 주문금액 현황</h2>
          <span class="note" id="m1Note"></span>
          <span class="spacer"></span>
          <button class="ghost" type="button" data-csv="m1">CSV 다운로드</button>
        </div>
        <div class="body flush"><div class="tablewrap"><table id="m1"></table></div></div>
      </section>

      <section class="card">
        <div class="head">
          <h2 id="m2Title">상품별 현황</h2>
          <span class="note">최근순 정렬 · 세트/단품 관계없이 카운팅</span>
          <span class="spacer"></span>
          <button class="ghost" type="button" data-csv="m2">CSV 다운로드</button>
        </div>
        <div class="body flush"><div class="tablewrap"><table id="m2"></table></div></div>
      </section>

      <footer>
        <div id="colmap"></div>
        <div id="coverage"></div>
        <div id="caveat"></div>
      </footer>
    </div>

    <!-- 프로모션 리뷰 : 발신·고객 데이터는 리뷰 시트, 매출은 주문 원장에서 계산합니다 -->
    <div id="reviewPane" hidden>
      <div id="rvBody"></div>

    if (!rows.length) throw new Error('읽을 수 있는 행이 없습니다 (날짜 열의 서식을 확인해 주세요)');

    var dates = Object.keys(dateSet).sort();
    var found = Object.keys(chSet);
    var channels = CH_ORDER.filter(function (c) { return chSet[c]; })
      .concat(found.filter(function (c) { return CH_ORDER.indexOf(c) < 0; }).sort());

    var months = {};
    dates.forEach(function (d) { months[d.slice(0, 7)] = 1; });

    return {
      rows: rows, dates: dates, channels: channels,
      months: Object.keys(months).sort(),
      maxDate: dates[dates.length - 1],
      memos: parseMemos(memoVals),
      notes: parseNotes(noteVals),
      promos: buildPromos(rows, promoVals, dates[dates.length - 1])
    };
  }

  /**
   * promotion 목록을 만듭니다.
   *  · 기획전 — 시트1의 promo 열에서 자동으로 모읍니다. 새 기획을 적으면 바로 나타납니다.
   *  · 제품군 — 'promotion' 탭(이름·제품라인·구분)에서 읽고, 탭이 없으면 기본값을 씁니다.
   * 마지막 매출일이 기준일로부터 7일 이내면 '진행 중'으로 올립니다.
   */
  function buildPromos(rows, promoVals, maxDate) {
    var 진행기준 = new Date(maxDate + 'T00:00:00');
    진행기준.setDate(진행기준.getDate() - 7);
    진행기준 = isoLocal(진행기준);

    var out = [];

    /* 제품군 */
    var 정의 = [];
    if (promoVals && promoVals.length > 1) {
      for (var i = 1; i < promoVals.length; i++) {
        var r = promoVals[i] || [];
        var 이름 = String(r[0] || '').trim(), 라인 = String(r[1] || '').trim();
        if (!이름 || !라인) continue;
        정의.push({ 이름: 이름, 제품라인: 라인, 구분: String(r[2] || '').trim() || '제품군' });
      }
    }
    /* 탭을 잘못 읽었거나 비어 있으면 기본값으로 돌아갑니다.
       한 줄도 실제 데이터에 걸리지 않으면 정의가 잘못된 것으로 보고 기본값을 씁니다. */
    function 제품군담기(목록) {
      var 담김 = [];
      목록.forEach(function (d) {
        var 해당 = rows.filter(function (x) { return x.line.indexOf(d.제품라인) >= 0; });
        if (!해당.length) return;
        담김.push({ 키: 'line:' + d.제품라인, 이름: d.이름, 구분: d.구분,
                    첫날: 해당[0].d,
                    끝날: 해당.reduce(function (m, x) { return x.d > m ? x.d : m; }, '') });
      });
      return 담김;
    }
    var 제품군 = 정의.length ? 제품군담기(정의) : [];
    if (!제품군.length) 제품군 = 제품군담기(CONFIG.제품군_기본);
    제품군.forEach(function (x) { out.push(x); });

    /* 기획전 — promo 열 자동 수집 */
    var 묶음 = {};
    rows.forEach(function (x) {
      if (!x.promo) return;
      var g = 묶음[x.promo] || (묶음[x.promo] = { 첫날: x.d, 끝날: x.d });
      if (x.d < g.첫날) g.첫날 = x.d;
      if (x.d > g.끝날) g.끝날 = x.d;
    });
    Object.keys(묶음).forEach(function (name) {
      var g = 묶음[name];
      out.push({ 키: 'promo:' + name, 이름: name,
                 구분: g.끝날 >= 진행기준 ? '진행 중' : '지난 기획전',
                 첫날: g.첫날, 끝날: g.끝날 });
    });

    /* 진행 중 → 제품군 → 지난 기획전, 그 안에서는 최근 시작일 순 */
    var 순서 = { '진행 중': 0, '제품군': 1, '지난 기획전': 2 };
    out.sort(function (a, b) {
      var x = (순서[a.구분] === undefined ? 1 : 순서[a.구분]);
      var y = (순서[b.구분] === undefined ? 1 : 순서[b.구분]);
      return x - y || (a.첫날 < b.첫날 ? 1 : -1);
    });
    return out;
  }

  /** 'flaoting comments' 탭 → { 날짜: 코멘트 } */
  function parseNotes(vals) {
    var out = {};
    if (!vals || vals.length < 2) return out;
    for (var i = 1; i < vals.length; i++) {
      var r = vals[i];
      if (!r || typeof r[0] !== 'number') continue;
      var txt = String(r[1] === undefined || r[1] === null ? '' : r[1]).trim();
      if (txt) out[serialToISO(r[0])] = txt;
    }
    return out;
  }

  /** memo 탭 → [{d, ch, code, text}] */
  function parseMemos(vals) {
    if (!vals || !vals.length) return [];
    var C;
    try { C = mapColumns(vals[0], ['date']); } catch (e) { return []; }
    var chI = C.ch, codeI = C.code, txtI = -1;
    var head = vals[0];
    for (var c = 0; c < head.length; c++) {
      var nm = String(head[c] || '').replace(/\s+/g, '');
      if (nm === '메모' || nm === '비고' || nm === '내용') { txtI = c; break; }
    }
    if (txtI < 0) txtI = head.length - 1;

    /* 날짜·판매처·상품코드·내용이 모두 같은 줄은 한 번만 씁니다.
       시트에 같은 메모가 여러 줄 들어가 있어도 화면에는 하나로 보입니다. */
    var out = [], seen = {};
    for (var i = 1; i < vals.length; i++) {
      var r = vals[i];
      if (!r || typeof r[C.date] !== 'number') continue;
      var text = String(r[txtI] === undefined || r[txtI] === null ? '' : r[txtI]).trim();
      if (!text) continue;
      var ch = String(chI >= 0 ? (r[chI] || '') : '').trim();
      var m = {
        d: serialToISO(r[C.date]),
        ch: MEMO_CH_ALIAS[ch] || ch,
        code: codeStr(codeI >= 0 ? r[codeI] : ''),
        text: text
      };
      var key = m.d + '' + m.ch + '' + m.code + '' + m.text;
      if (seen[key]) continue;
      seen[key] = 1;
      out.push(m);
    }
    return out;
  }

  /* 메모 조회용 색인 */
  var memoIdx = {};
  function buildMemoIndex() {
    memoIdx = {};
    (DATA.memos || []).forEach(function (m) {
      var keys = ['d:' + m.d + '|c:' + m.ch];
      if (m.code) keys.push('d:' + m.d + '|c:' + m.ch + '|p:' + m.code);
      keys.forEach(function (k) { (memoIdx[k] = memoIdx[k] || []).push(m); });
    });
  }
  function memoAt(d, ch, code) {
    return memoIdx['d:' + d + '|c:' + ch + (code ? '|p:' + code : '')] || null;
  }
  /** 해당 판매처·날짜의 메모 중 상품코드가 없는 것 (m2 날짜 헤더용) */
  function memoDateOnly(d, ch) {
    var all = memoIdx['d:' + d + '|c:' + ch];
    if (!all) return null;
    var only = all.filter(function (m) { return !m.code; });
    return only.length ? only : null;
  }

  /* ═══════════════════════════════════════════════════════
     상태 & 컨트롤
     ═══════════════════════════════════════════════════════ */
  var qs = new URLSearchParams(location.search);
  var state = {
    ch: qs.get('ch') || '',
    metric: qs.get('metric') === 'qty' ? 'qty' : 'amt',
    month: qs.get('month') || '',
    promo: qs.get('promo') || '',         // 'promo:이름' 또는 'line:문자열'
    tab: qs.get('tab') === 'review' ? 'review' : 'sales',
    rv: qs.get('rv') || '',               // 리뷰 탭에서 고른 프로모션 키
    /* 'guest' 면 관리자도 다른 분들이 보는 화면을 그대로 봅니다 */
    view: qs.get('view') === 'guest' ? 'guest' : 'admin'
  };

  /**
   * 지금 어느 화면을 보여줄지 정합니다.
   * 관리자 기능은 전부 is-admin 에 걸려 있으므로, 이 클래스 하나만 떼면
   * 앞으로 늘어날 기능까지 함께 감춰집니다.
   */
  function applyView() {
    var 관리자화면 = viewerIsAdmin && state.view !== 'guest';
    document.documentElement.classList.toggle('is-admin', 관리자화면);
    var b = document.getElementById('viewToggle');
    b.textContent = 관리자화면 ? '일반 화면 보기' : '일반 화면 미리보기 · 돌아가기';
    b.title = 관리자화면 ? '다른 분들이 보는 화면으로 바꿔 봅니다'
                        : '관리자 화면으로 돌아갑니다';
  }

  function buildControls() {
    var p = document.getElementById('period');
    p.innerHTML = '<option value="">최근 ' + CONFIG.RECENT_DAYS + '일</option>' +
      DATA.months.slice().reverse().map(function (m) {
        var y = m.slice(0, 4), mm = Number(m.slice(5, 7));
        return '<option value="' + m + '">' + y + '년 ' + mm + '월</option>';
      }).join('');
    if (state.month && DATA.months.indexOf(state.month) < 0) state.month = '';
    p.value = state.month;
    p.onchange = function () { state.month = p.value; syncUrl(); render(); };

    var c = document.getElementById('channel');
    c.innerHTML = '<option value="">전체 판매처</option>' +
      DATA.channels.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('');
    if (state.ch && DATA.channels.indexOf(state.ch) < 0) state.ch = '';
    c.value = state.ch;
    c.onchange = function () { state.ch = c.value; syncUrl(); render(); };

    var pr = document.getElementById('promo');
    var 그룹 = [], 담김 = {};
    (DATA.promos || []).forEach(function (x) {
      if (!담김[x.구분]) { 담김[x.구분] = []; 그룹.push(x.구분); }
      담김[x.구분].push(x);
    });
    pr.innerHTML = '<option value="">전체</option>' + 그룹.map(function (g) {
      return '<optgroup label="' + esc(g) + '">' + 담김[g].map(function (x) {
        var 기간 = x.구분 === '지난 기획전'
          ? ' · ' + x.첫날.slice(5).replace('-', '/') + '~' + x.끝날.slice(5).replace('-', '/')
          : '';
        return '<option value="' + esc(x.키) + '">' + esc(x.이름 + 기간) + '</option>';
      }).join('') + '</optgroup>';
    }).join('');
    if (state.promo && !pr.querySelector('option[value="' + state.promo.replace(/"/g, '') + '"]')) {
      state.promo = '';
    }
    pr.value = state.promo;
    pr.onchange = function () {
      state.promo = pr.value;
      state.rv = '';                 /* 프로모션이 바뀌면 리뷰 선택도 다시 잡습니다 */
      syncUrl(); render();
    };

    document.getElementById('tabs').onclick = function (e) {
      var b = e.target.closest('button[data-tab]');
      if (!b) return;
      state.tab = b.dataset.tab;
      syncUrl(); render();
    };

    document.getElementById('metric').onclick = function (e) {
      var b = e.target.closest('button[data-v]'); if (!b) return;
      state.metric = b.dataset.v;
      Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) {
        x.setAttribute('aria-pressed', String(x === b));
      });
      syncUrl(); render();
    };
    document.getElementById('reload').onclick = loadAll;
    document.getElementById('viewToggle').onclick = function () {
      state.view = (state.view === 'guest') ? 'admin' : 'guest';
      applyView(); syncUrl();
    };
  }

  function syncUrl() {
    var p = new URLSearchParams();
    if (state.ch) p.set('ch', state.ch);
    if (state.month) p.set('month', state.month);
    if (state.metric !== 'amt') p.set('metric', state.metric);
    if (state.promo) p.set('promo', state.promo);
    if (state.tab === 'review') p.set('tab', 'review');
    if (state.tab === 'review' && state.rv) p.set('rv', state.rv);
    /* 관리자일 때만 남깁니다 — 미리보기 중에 복사한 링크를 팀원이 열어도
       첫 조작에서 이 표시가 저절로 떨어져 나갑니다. */
    if (viewerIsAdmin && state.view === 'guest') p.set('view', 'guest');
    var q = p.toString();
    history.replaceState(null, '', location.pathname + (q ? '?' + q : ''));
    document.getElementById('channel').value = state.ch;
    document.getElementById('period').value = state.month;
    document.getElementById('promo').value = state.promo;
    logVisit();                      /* 판매처를 바꾼 것도 방문 기록에 남습니다 */
  }

  /* ═══════════════════════════════════════════════════════
     집계
     ═══════════════════════════════════════════════════════ */
  function isoLocal(d) {
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }

  function windowDates() {
    if (state.month) {
      return DATA.dates.filter(function (d) { return d.slice(0, 7) === state.month; });
    }
    var to = DATA.maxDate;
    var f = new Date(to + 'T00:00:00');
    f.setDate(f.getDate() - (CONFIG.RECENT_DAYS - 1));
    var from = isoLocal(f);
    return DATA.dates.filter(function (d) { return d >= from && d <= to; });
  }

  function aggregate() {
    var win = windowDates();
    var di = {}; win.forEach(function (d, i) { di[d] = i; });
    var n = win.length;
    var chs = DATA.channels, ci = {}; chs.forEach(function (c, i) { ci[c] = i; });

    var chV = chs.map(function () { return zeros(n); });
    var chHas = chs.map(function () { return zeros(n); });
    var chTot = zeros(chs.length);
    var dayTot = zeros(n);
    var pIdx = {}, prods = [], pV = [], pHas = [], pTot = [];

    for (var k = 0; k < DATA.rows.length; k++) {
      var r = DATA.rows[k];
      var j = di[r.d]; if (j === undefined) continue;
      if (state.ch && r.ch !== state.ch) continue;
      if (!promoMatch(r)) continue;
      var v = state.metric === 'amt' ? r.amt : r.qty;

      var c = ci[r.ch];
      if (c !== undefined) { chV[c][j] += v; chHas[c][j] = 1; chTot[c] += v; }
      dayTot[j] += v;

      var key = r.code + '|@|' + r.name;
      var p = pIdx[key];
      if (p === undefined) {
        p = prods.length; pIdx[key] = p;
        prods.push([r.line, r.code, r.name, r.price]);
        pV.push(zeros(n)); pHas.push(zeros(n)); pTot.push(0);
      }
      pV[p][j] += v; pHas[p][j] = 1; pTot[p] += v;
      if (!prods[p][3] && r.price) prods[p][3] = r.price;
    }
    return { win: win, n: n, chs: chs, chV: chV, chHas: chHas, chTot: chTot,
             dayTot: dayTot, prods: prods, pV: pV, pHas: pHas, pTot: pTot };
  }

  function zeros(n) { var a = new Array(n); for (var i = 0; i < n; i++) a[i] = 0; return a; }

  /** promotion 선택에 맞는 행인지 — 기획전은 promo 열, 제품군은 제품라인 포함 여부 */
  function promoMatch(r) {
    if (!state.promo) return true;
    var i = state.promo.indexOf(':');
    var 종류 = state.promo.slice(0, i), 값 = state.promo.slice(i + 1);
    if (종류 === 'promo') return r.promo === 값;
    if (종류 === 'line') return r.line.indexOf(값) >= 0;
    return true;
  }

  /** 지금 고른 promotion 의 이름 */
  function promoName() {
    if (!state.promo) return '';
    var f = (DATA.promos || []).filter(function (x) { return x.키 === state.promo; })[0];
    return f ? f.이름 : '';
  }

  /**
   * 날짜 표시 순서.
   * 최근 30일은 최신이 위(내림차순), 월 기준은 1일부터 아래로(오름차순)입니다.
   */
  function dateSeq(n) {
    var a = [], i;
    if (state.month) { for (i = 0; i < n; i++) a.push(i); }
    else { for (i = n - 1; i >= 0; i--) a.push(i); }
    return a;
  }

  /** 실적이 있는 날만 평균 — 엑셀 피벗의 AVERAGE와 동일 */
  function avgOf(vals, has, n) {
    var s = 0, c = 0;
    for (var j = 0; j < n; j++) if (has[j]) { s += vals[j]; c++; }
    return c ? s / c : 0;
  }
  function sumOf(vals, n) { var s = 0; for (var j = 0; j < n; j++) s += vals[j]; return s; }

  /* ═══════════════════════════════════════════════════════
     포맷
     ═══════════════════════════════════════════════════════ */
  var nf = new Intl.NumberFormat('ko-KR');
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function md(ds) { return ds.slice(5) + '(' + WD[new Date(ds + 'T00:00:00').getDay()] + ')'; }

  /** 금액 : ₩ 접두, 마이너스는 빨간색 */
  function money(v) {
    if (!v) return '';
    var s = '₩' + nf.format(Math.abs(Math.round(v)));
    return v < 0 ? '<span class="neg">-' + s + '</span>' : s;
  }
  function qtyFmt(v) {
    if (!v) return '';
    var s = nf.format(Math.abs(Math.round(v)));
    return v < 0 ? '<span class="neg">-' + s + '</span>' : s;
  }
  function val(v) { return state.metric === 'amt' ? money(v) : qtyFmt(v); }
  /** 수량은 가운데, 금액은 우측 정렬 */
  function alignCls() { return state.metric === 'amt' ? '' : ' c'; }
  function unitTxt() { return state.metric === 'amt' ? '주문금액' : '주문수량'; }

  function compact(v) {
    var a = Math.abs(v);
    if (state.metric === 'qty') return nf.format(Math.round(v));
    if (a >= 1e8) return (v / 1e8).toFixed(2) + '억';
    if (a >= 1e4) return nf.format(Math.round(v / 1e4)) + '만';
    return nf.format(Math.round(v));
  }
  /**
   * [빨강]▲ +#,##0.0% ; [파랑]▼ -#,##0.0% ; (동일)
   * 엑셀 서식과 같은 규칙으로, 오를 때 빨강·내릴 때 파랑입니다.
   */
  function pctSigned(r) {
    if (r === null || !isFinite(r)) return '—';
    var p = Math.abs(r * 100).toFixed(1);
    if (r > 0.00005)  return '<span style="color:var(--up)">▲ +' + p + '%</span>';
    if (r < -0.00005) return '<span style="color:var(--down)">▼ -' + p + '%</span>';
    return '<span style="color:var(--ink-muted)">(동일)</span>';
  }

  function chip(r) {
    if (r === null || !isFinite(r)) return '<span class="chip flat">기준 없음</span>';
    var c = r > 0.0005 ? 'up' : r < -0.0005 ? 'down' : 'flat';
    var m = r > 0.0005 ? '▲' : r < -0.0005 ? '▼' : '−';
    return '<span class="chip ' + c + '">' + m + ' ' + (r > 0 ? '+' : '') + (r * 100).toFixed(1) + '%</span>';
  }

  /* ═══════════════════════════════════════════════════════
     렌더
     ═══════════════════════════════════════════════════════ */
  var csvCache = {};

  /**
   * 탭 모양을 상태에 맞춥니다.
   * 고른 promotion 이 없으면 볼 리뷰도 없으므로 탭 줄을 통째로 감춥니다 —
   * 전체 화면은 탭이 생기기 전과 똑같아 보입니다.
   */
  function syncTabs() {
    var bar = document.getElementById('tabs');
    var 가능 = !!state.promo;
    if (!가능 && state.tab === 'review') state.tab = 'sales';
    bar.hidden = !가능;
    Array.prototype.forEach.call(bar.querySelectorAll('button[data-tab]'), function (b) {

    var 고객수 = 세기(고객), 품목고객수 = 세기(품목고객), 품목신규수 = 세기(품목신규);

    return { 시작: lo, 끝: hi, 잘림: hi !== to,
             총매출: 총, 총수량: 총수량, 품목매출: 품목, 품목수량: 품목수량,
             품목plus매출: 품목plus,
             전체구매고객수: 고객수, 전체주문수: 세기(주문),
             구매고객수: 품목고객수, 신규고객수: 품목신규수,
             기존고객수: 품목고객수 - 품목신규수, 주문수: 세기(품목주문),
             기준: 폰기준 ? '휴대전화번호' : '주문자ID', 번호없는주문: 세기(무키주문) };
  }

  /** 이 구간을 마감 요약이 온전히 덮고 있는지 */
  function ordCovers(from, to) {
    var D = ORD.daily;
    return !!(D && from && to && from >= D.min && to <= D.max);
  }

  /* ── 불러오기 ───────────────────────────────────────────── */
  function ensureReview() {
    if (reviewState === 'ready' || reviewState === 'loading') { renderReview(); return; }
    reviewState = 'loading';
    reviewError = null;
    renderReview();
    /* 리뷰 시트와 마감 매출 요약을 함께 부릅니다. 마감 요약이 없거나 실패해도
       리뷰는 잠정치로 그려지므로, 실패를 리뷰 전체의 실패로 만들지 않습니다. */
    Promise.all([
      tabNameByGid(CONFIG.REVIEW_SHEET_ID, CONFIG.REVIEW_GID).then(function (title) {
        return sheetValuesOf(CONFIG.REVIEW_SHEET_ID, quoteTab(title, 'A1:BZ'));
      }),
      loadOrdTab('daily')
    ]).then(function (res) {
      REVIEW = parseReview(res[0]);
      reviewState = 'ready';
      renderReview();
    }).catch(function (e) {
      reviewError = e;
      reviewState = 'error';
      renderReview();
    });
  }

  /* ── 그리기 ─────────────────────────────────────────────── */
  function rvCard(title, note, inner, foot, 머리끝) {
    return '<section class="card"><div class="head"><h2>' + esc(title) + '</h2>' +
           (note ? '<span class="note">' + note + '</span>' : '') +
           (머리끝 ? '<span class="spacer"></span>' + 머리끝 : '') + '</div>' + inner +
           (foot ? '<div class="rv-note">' + foot + '</div>' : '') + '</section>';
  }
  function rvEmptyBox(title, html) {
    return '<div class="rv-empty"><b>' + esc(title) + '</b>' + html + '</div>';
  }
  function rvDay(ds) {
    if (!ds) return '';
    return ds.replace(/-/g, '.') + ' (' + WD[new Date(ds + 'T00:00:00').getDay()] + ')';
  }
  function promoPickedValue() {
    var i = state.promo.indexOf(':');
    return i < 0 ? state.promo : state.promo.slice(i + 1);
  }

  function renderReview() {
    var body = document.getElementById('rvBody');

    if (reviewState === 'loading') {
      body.innerHTML = '<div class="status"><div class="spinner"></div>' +
                       '<span>리뷰 시트에서 불러오는 중…</span></div>';
      return;
    }
    if (reviewState === 'error') {
      body.innerHTML = '<div class="errbox"><b>리뷰 데이터를 불러오지 못했습니다</b>' +
        esc(hintFor(reviewError)) +
        '<details><summary>자세한 오류 메시지</summary><code>' +
        esc(String((reviewError && reviewError.message) || reviewError)) + '</code></details>' +
        '<button class="ghost" type="button" id="rvRetry">다시 시도</button></div>';
      var rb = document.getElementById('rvRetry');
      if (rb) rb.onclick = function () { reviewState = 'idle'; ensureReview(); };
      return;
    }
    if (reviewState !== 'ready') { body.innerHTML = ''; return; }

    var 매칭 = (REVIEW || []).filter(rvMatches);
    var 매칭없음 = !매칭.length;
    var 목록 = 매칭없음 ? (REVIEW || []) : 매칭;

    if (!목록.length) {
      body.innerHTML = rvEmptyBox('리뷰 시트에 등록된 프로모션이 없습니다',
        '<b>프로모션명</b>과 <b>전략시작일</b>이 모두 채워진 줄만 읽습니다. ' +
        '두 칸을 채우시면 여기에 바로 나타납니다.');
      return;
    }

    /* 매칭이 없어 전체 목록을 보여줄 때는 상세를 몇 건만 그립니다 —
       프로모션이 수십 건이면 한 페이지에 다 펼쳐 봐야 읽히지 않아서요. */
    var 상세목록 = 매칭없음 ? 목록.slice(0, CONFIG.리뷰_상세_최대) : 목록;

    /* 주문 단위 요약은 무거우므로, 자사몰 프로모션을 실제로 열었을 때만 부릅니다.
       loadOrdTab 이 상태를 곧바로 'loading' 으로 바꾸므로 다시 부르지 않습니다. */
    if (ordState.line === 'idle' && ORD.daily && 상세목록.some(function (p) {
      var c = p.정보.구매채널 || CONFIG.ORDER_CHANNEL;
      return c.indexOf(CONFIG.ORDER_CHANNEL) >= 0;
    })) {
      loadOrdTab('line').then(renderReview);
    }

    var 안내 = 매칭없음
      ? rvEmptyBox('이 페이지의 프로모션은 리뷰 시트에 아직 없습니다',
          '리뷰 시트의 <b>제품라인</b>에 <b>' + esc(promoPickedValue()) + '</b>이(가) 들어 있거나, ' +
          '<b>프로모션명</b>이 promotion 목록의 이름과 같으면 자동으로 연결됩니다.<br>' +
          '아래는 리뷰 시트에 있는 전체 프로모션입니다.')
      : '';

    var csv = [];
    var 상세 = 상세목록.map(rvContext);

    var html = 안내 +
      '<div class="rv-top"><span>프로모션 ' + 목록.length + '건</span>' +
      '<span class="sp"></span>' +
      '<button class="ghost" type="button" data-csv="rv">CSV 다운로드</button></div>';
    상세.forEach(function (ctx, i) {
      html += '<section class="rv-sec" id="rv' + i + '" data-key="' + esc(ctx.p.키) + '">' +
              '<h3 class="rv-h">' + esc(ctx.p.이름) +
              '<span class="when">' + esc(rvSpan(ctx)) + '</span></h3>' +
              rvDetail(ctx, csv) + '</section>';

    if (목록.length > 상세.length) {

              '건은 생략했습니다 (' +
              esc(목록.slice(상세.length).map(function (p) { return p.이름; }).join(' · ')) +
              ') — promotion 을 고르시면 그 프로모션이 펼쳐집니다.</div>';
    }
    csvCache.rv = { name: (promoName() || '프로모션') + '_리뷰', rows: csv };
    body.innerHTML = html;

    /* 공유받은 ?rv=… 링크로 들어오면 그 프로모션 위치로 내려갑니다 */
    if (state.rv) {
      var secs = body.querySelectorAll('.rv-sec');
      for (var s = 0; s < secs.length; s++) {

  /** '2026.02.02 ~ 02.08 · 7일' */
  function rvSpan(ctx) {
    var 끝 = ctx.to;
    return ctx.from.replace(/-/g, '.') + ' ~ ' + 끝.slice(5).replace('-', '.') +
           ' · ' + calDays(ctx.from, 끝) + '일';
  }


  /** 이 리뷰를 어느 시트로 냈는지, 그리고 걸리는 게 있으면 무엇인지 */
  function rvSourceStrip(ctx) {
    var D = ORD.daily;
    var out = '<div class="rv-src">';
    out += ctx.마감
      ? '<span class="pill final">마감 기준</span>' +

    out += '<span class="sp"></span>';
    if (D) out += '<span>주문 원장 ' + D.min.replace(/-/g, '.') + ' ~ <b>' +
                  D.max.replace(/-/g, '.') + '</b></span>';
    else if (ordState.daily === 'off') out += '<span>주문 원장 미연결</span>';
    else if (ordState.daily === 'error') out += '<span>주문 원장을 읽지 못했습니다</span>';
    out += '</div>';

    var w = [];

      } else if (ordState.daily === 'error') {
        w.push('자사몰주문RAWDATA 요약 탭을 읽지 못했습니다 — ' + esc(hintFor(ordError.daily)));
      } else if (!ctx.자사몰) {
        w.push('구매채널이 <b>' + esc(ctx.p.정보.구매채널 || '미입력') +
               '</b> 이라 자사몰 주문 원장으로는 낼 수 없습니다.');
      } else if (D) {
        w.push('비교 기준 구간(직전 30일 ' + dayShift(ctx.from, -30).replace(/-/g, '.') +
               ' · 작년 ' + lastYearOf(ctx.from).replace(/-/g, '.') + ')이 주문 원장 범위 밖이라 ' +
               '잠정치로 냈습니다 — 네 구간을 같은 시트에서 내야 증감률이 기울지 않습니다.');
      }
    }
    if (!ctx.p.정보.구매채널) {
      w.push('구매채널 열이 비어 있어 <b>자사몰</b>로 보고 계산했습니다.');
    }
    if (ctx.p.정보.라인추정) {
      w.push('제품라인 열이 비어 있어 프로모션명에서 <b>' + esc(ctx.p.정보.라인) +
             '</b> 으로 추정했습니다 — 행사품목매출이 이 기준으로 나옵니다. ' +
             '다르면 리뷰 시트의 제품라인 열을 채워 주세요.');
    }
    if (ctx.행사 && ctx.행사.잘림) {
      w.push('행사기간 중 <b>' + ctx.행사.끝.replace(/-/g, '.') + '</b> 까지만 들어 있습니다' +
             (ctx.마감 && D && D.max < DATA.maxDate
               ? ' — 자사몰주문RAWDATA에 최신분을 붙여넣으시면 나머지가 채워집니다.'
               : ' — 아직 지나지 않은 기간입니다.'));
    }
    if (ctx.마감 && !ctx.주문) {
      if (ordState.line === 'loading') {
        w.push('구매고객수·추가구매매출을 불러오는 중입니다…');
      } else if (ordState.line === 'off') {
        w.push('주문라인요약 탭을 연결하면 구매고객수·신규/기존·추가구매매출이 자동으로 계산됩니다.');
      } else if (ordState.line === 'error') {

  }

  /** 프로모션 하나의 계산 결과를 모읍니다 — 그리는 쪽은 이 값만 봅니다 */
  function rvContext(p) {
    var i = p.정보;
    var from = p.시작, to = p.종료 || p.시작;

    /* 구매채널이 비어 있으면 자사몰로 봅니다 — 프로모션은 자사몰 대상이 기본입니다.
       '전체'이거나 원본 판매처 표기에 없는 이름이면 판매처를 거르지 않습니다. */
    var 채널 = i.구매채널 || CONFIG.ORDER_CHANNEL;
    var ch = !/^(전체|ALL)$/i.test(채널) ? 채널 : '';
    if (ch && DATA.channels.indexOf(ch) < 0) ch = '';
    var 라인 = (i.라인 && !/^(ALL|전체)$/i.test(i.라인)) ? i.라인 : '';
    /* 원본 promo 열에 같은 이름이 적혀 있으면 제품라인보다 그쪽을 먼저 씁니다 */
    var promoKey = DATA.rows.some(function (r) { return r.promo && r.promo === p.이름; })
      ? p.이름 : '';

    /* 어느 시트로 계산할지 정합니다.
       마감(자사몰주문RAWDATA)을 쓰려면 구매채널이 자사몰이어야 하고, 비교 기준이 되는
       세 구간(직전 7일·30일·작년)이 모두 요약에 들어 있어야 합니다.
       한 리뷰 안에서 소스를 섞으면 증감률이 한쪽으로 기울기 때문에, 조건이 하나라도
       어긋나면 네 구간 모두 잠정치(일일매출RAWDATA)로 냅니다. */
    var 전7시작 = dayShift(from, -7),  전7끝 = dayShift(from, -1);
    var 전30시작 = dayShift(from, -30), 전30끝 = 전7끝;
    var 작년시작 = lastYearOf(from), 작년끝 = lastYearOf(to);
    var 자사몰 = 채널.indexOf(CONFIG.ORDER_CHANNEL) >= 0;
    var 마감 = !!(ORD.daily && 자사몰 &&
                  ordCovers(전7시작, 전7끝) && ordCovers(전30시작, 전30끝) &&
                  ordCovers(작년시작, 작년끝) && ordCovers(from, from));

    var S = 마감 ? ordSum : rvSum;
    /* 마감 요약에는 promo 열이 없으므로 행사품목은 제품라인으로만 봅니다 */
    var 품목조건 = 마감 ? { line: 라인 } : { ch: ch, line: 라인, promo: promoKey };
    var 전체조건 = 마감 ? {} : { ch: ch };

    var ctx = {
      p: p, from: from, to: to, ch: ch, 라인: 라인, promoKey: 마감 ? '' : promoKey,
      마감: 마감, 자사몰: 자사몰,
      품목필터있음: !!(마감 ? 라인 : (promoKey || 라인)),
      행사:     S(from, to, { ch: ch, clamp: true }),
      품목:     S(from, to, { ch: ch, line: 라인, promo: 품목조건.promo, clamp: true }),
      전7:      S(전7시작, 전7끝, 전체조건),
      전30:     S(전30시작, 전30끝, 전체조건),
      작년:     S(작년시작, 작년끝, 전체조건),
      품목전7:  S(전7시작, 전7끝, 품목조건),
      품목전30: S(전30시작, 전30끝, 품목조건),
      품목작년: S(작년시작, 작년끝, 품목조건),
      주문: null, 유입합: null, 구매고객: i.구매고객, 시트구매고객: i.구매고객
    };
    p.발신.forEach(function (r) {
      if (r.유입 !== null && r.유입 !== undefined) ctx.유입합 = (ctx.유입합 || 0) + r.유입;
    });

    /* 주문 단위 숫자(구매고객수·신규/기존·추가구매매출)는 행사기간에만 필요합니다 */
    if (마감 && ordState.line === 'ready') {
      ctx.주문 = ordStats(from, to, 라인);
      if (ctx.주문) {
        ctx.구매고객 = ctx.주문.구매고객수;          /* 행사품목이 든 주문을 한 사람만 */
        ctx.신규고객 = ctx.주문.신규고객수;
        ctx.기존고객 = ctx.주문.기존고객수;
        ctx.전체구매고객 = ctx.주문.전체구매고객수;  /* 행사기간에 산 모든 사람 */
      }
    }

    return ctx;
  }

  /** 프로모션 하나의 상세 — 기준 띠 + 카드 여섯 장 */
  function rvDetail(ctx, csv) {
    csv.push([]);
    csv.push(['[' + ctx.p.이름 + ']',
              ctx.마감 ? '마감 (자사몰주문RAWDATA · 취소·환불 반영)'
                       : '잠정 (일일매출RAWDATA · 취소·환불 미반영)']);
    return rvSourceStrip(ctx) +
           rvOverviewCard(ctx, csv) + rvSendCard(ctx, csv) +
           rvBuyerCard(ctx, csv) + rvSalesCard(ctx, csv) + rvAovCard(ctx, csv) +
           rvVsCard(ctx, csv);
  }

  /** 프로모션 하나만 그립니다 — 테스트에서 씁니다 */
  function rvCards(p) {
    var csv = [];
    var html = rvDetail(rvContext(p), csv);
    csvCache.rv = { name: (p.이름 || '프로모션') + '_리뷰', rows: csv };
    return html;
  }

  /** 개요 — 한 줄에 한 항목씩 세로로 나열합니다 */
  function rvOverviewCard(ctx, csv) {
    var i = ctx.p.정보;
    /* 발신타겟은 발신마다 다를 수 있으므로(구매고객·비구매고객) 모아서 보여줍니다 */
    var 타겟 = [], 본것 = {};
    ctx.p.발신.forEach(function (r) {
      if (r.발신타겟 && !본것[r.발신타겟]) { 본것[r.발신타겟] = 1; 타겟.push(r.발신타겟); }
    });

    var t = [
      ['프로모션명', ctx.p.이름, 'title'],
      ['전략시작일', rvDay(ctx.from), ''],
      ['전략종료일', rvDay(ctx.to), ''],
      ['행사기간', i.기간 || (calDays(ctx.from, ctx.to) + '일'), ''],
